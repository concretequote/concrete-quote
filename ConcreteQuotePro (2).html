<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#0c0c0c;}

  .trip-box{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin-bottom:8px;}

  .cost-row.indented{padding-left:8px;}
  .cost-row.bold{border-bottom-color:#2a2000;}
  .cost-label{font-size:10px;color:#666;}
  .cost-label.bold{font-size:11px;color:#ccc;font-weight:700;}
  .cost-sub{font-size:8px;color:#444;margin-left:4px;}
  .cost-val{font-family:'DM Mono',monospace;font-size:10px;color:#888;}
  .cost-val.bold{font-size:12px;color:#eee;font-weight:700;}

  /* Profit highlight */
  .profit-row{margin-top:6px;background:#1e1500;border:1px solid #f5a62330;border-radius:6px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;}
  .profit-row-label{font-size:12px;color:#f5c060;font-weight:700;}
  .profit-row-sub{font-size:8px;color:#7a6020;}
  .profit-row-val{font-family:'DM Mono',monospace;font-size:15px;color:#f5a623;font-weight:700;}

  /* Grand total */
  .grand-total{background:linear-gradient(135deg,#1a1200,#261c00);border:2px solid #f5a62340;border-radius:10px;padding:16px;text-align:center;margin-bottom:10px;}
  .grand-label{font-size:8px;color:#f5a623;letter-spacing:0.2em;margin-bottom:5px;}
  .grand-amount{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;color:#f5a623;letter-spacing:-0.03em;}
  .grand-stats{display:flex;justify-content:center;gap:14px;margin-top:8px;flex-wrap:wrap;}
  .grand-stat-k{font-size:7px;color:#555;letter-spacing:0.1em;}
  .grand-stat-v{font-size:11px;color:#aaa;font-family:'DM Mono',monospace;}
  .grand-stat-v.highlight{color:#f5a623;font-weight:700;}

  /* Disclaimer */
  .disclaimer{padding:8px 10px;background:#0e0e0e;border-radius:6px;border:1px solid #181818;margin-bottom:20px;font-size:8.5px;color:#3a3a3a;line-height:1.6;}

  /* Custom warning */

  /* Empty state */

</style>

<body>
<div id="root"></div>

<script>
// ─── CONSTANTS ──────────────────────────────────────────────────────────────
const P = {
  concrete: {
    "20-25 MPa (Plain Broom)": 240,
    "30-35 MPa (Stamped / Exposed)": 265,
    "40+ MPa (High Strength)": 290,
  },
  concreteDelivery: 125,
  concreteWaste: 0.10,
  gravelPerTonne: 42,
  gravelCompactionFactor: 1.30,
  gravelDensity: 1.8,
  rebarStickCost: 3.30,
  rebarStickFt: 10,
  rebarSpacingIn: 18,
  rebarWaste: 0.10,
  formBoard2x4Cost: 6.60,
  formBoard2x6Cost: 5.98,
  formBoardFt: 8,
  formWaste: 0.15,
  generalLabour: 150,
  pickupTruck: 150,
  bobcatTrailer: 350,
  trailerCapacityLb: 10000,
  dumpBin: 500,
  binEffectiveYards: 10,
  plateCompactor: 95,
  jackhammer: 135,
  stampRental: 150,
  colorHardenerPerSqft: 0.55,
  releaseAgentPerSqft: 0.18,
  sealerStamped: 0.35,
  sealerExposed: 0.30,
  soilLbPerCuFt: 100,
  PROFIT_RATE: 0.30,
  truckCapacityM3: 9,   // standard ready-mix truck Ontario — second truck if exceeded
};

const DIG_PRESETS = [
  { label:'8″ (4″ gravel\n+ 4″ concrete)', totalIn:8,  gravelIn:4 },
  { label:'10″ (5″ gravel\n+ 5″ concrete)', totalIn:10, gravelIn:5 },
  { label:'Custom', totalIn:null, gravelIn:null },
];
const FINISHES    = ["Plain Broom","Stamped","Exposed Aggregate"];
const MPA_OPTIONS = Object.keys(P.concrete);
const SITE_OPTIONS= ["Grass / Soil","Existing Concrete (break + remove)"];

function fmtCAD(n){
  return new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:2}).format(n||0);
}
function inToM(i){ return i*0.0254; }

// ─── STATE ──────────────────────────────────────────────────────────────────
let state = {
  tab: 'inputs',
  length: 20, width: 10,
  presetIdx: 0,
  customTotal: 8, customGravel: 4,
  finish: 'Plain Broom',
  mpa: MPA_OPTIONS[0],
  siteType: SITE_OPTIONS[0],
  workDays: 1,
  useTruck: true, useBobcat: true, useBin: false,
  useCompactor: true, useJack: false,
  disposalPerTon: 15,
  useSecondSlab: false,
  length2: 10, width2: 12,
  presetIdx2: 0,
  customTotal2: 8, customGravel2: 4,
  finish2: 'Plain Broom',
  useSteps: false,
  stepsCount: 3,
  stepsRise: 7.5,
  stepsRun: 12,
  stepsWidth: 4,
  stepsGravelPreset: 0,
  stepsCustomGravel: 4,
};

function setState(patch){
  state = {...state, ...patch};
  render();
}

// ─── SLAB CALC HELPER ────────────────────────────────────────────────────────
function calcSlab(L, W, totalIn, gravelIn, finish, workDays){
  const concreteIn = totalIn - gravelIn;
  if(!L||!W||!totalIn||!gravelIn||concreteIn<=0) return null;
  const areaFt2 = L*W, areaM2 = areaFt2*0.0929;
  const concM3raw = areaM2*inToM(concreteIn);
  const concM3    = concM3raw*(1+P.concreteWaste);
  const gravelM3  = areaM2*inToM(gravelIn)*P.gravelCompactionFactor;
  const gravelTonnes = gravelM3*P.gravelDensity;
  const spacingFt = P.rebarSpacingIn/12;
  const totalRunFt = (Math.ceil(L/spacingFt)+1)*W+(Math.ceil(W/spacingFt)+1)*L;
  const rebarSticks = Math.ceil((totalRunFt/P.rebarStickFt)*(1+P.rebarWaste));
  const use2x6 = concreteIn >= 5;
  const formBoardCost = use2x6 ? P.formBoard2x6Cost : P.formBoard2x4Cost;
  const formBoardLabel = use2x6 ? '2×6' : '2×4';
  const formBoards = Math.ceil((2*(L+W)/P.formBoardFt)*(1+P.formWaste));
  const formCost = formBoards*formBoardCost;
  const soilCuFt = areaFt2*(totalIn/12);
  const soilYards = soilCuFt/27;
  const soilTons  = (soilCuFt*P.soilLbPerCuFt)/2000;
  const isStamped = finish==='Stamped', isExposed = finish==='Exposed Aggregate';
  const colorHardenerCost = isStamped?areaFt2*P.colorHardenerPerSqft:0;
  const releaseCost       = isStamped?areaFt2*P.releaseAgentPerSqft:0;
  const stampRentalCost   = isStamped?P.stampRental*workDays:0;
  const sealerCost        = isStamped?areaFt2*P.sealerStamped:isExposed?areaFt2*P.sealerExposed:0;
  return {
    L,W,totalIn,gravelIn,concreteIn,areaFt2,areaM2,
    concM3,gravelTonnes,rebarSticks,formBoards,formCost,formBoardLabel,formBoardCost,use2x6,
    soilCuFt,soilYards,soilTons,
    isStamped,isExposed,colorHardenerCost,releaseCost,stampRentalCost,sealerCost,
    gravelCost: gravelTonnes*P.gravelPerTonne,
    rebarCost:  rebarSticks*P.rebarStickCost,
  };
}

// ─── STEPS CALC HELPER ───────────────────────────────────────────────────────
function calcSteps(count, riseIn, runIn, widthFt, gravelBaseIn){
  const N=parseFloat(count), R=parseFloat(riseIn), U=parseFloat(runIn), W=parseFloat(widthFt), G=parseFloat(gravelBaseIn)||4;
  if(!N||!R||!U||!W||N<=0||R<=0||U<=0||W<=0) return null;

  // Concrete: staircase volume = W × (R/12) × (U/12) × N(N+1)/2
  // Each step adds a full-width, full-depth layer that is Rise tall
  const concFt3 = W * (R/12) * (U/12) * (N*(N+1)/2);
  const concM3  = (concFt3/35.315) * (1+P.concreteWaste);

  // Step footprint for gravel base
  const footprintFt2 = W * N * (U/12);
  const footprintM2  = footprintFt2 * 0.0929;

  // Gravel: selectable base depth under steps
  const gravelM3     = footprintM2 * inToM(G) * P.gravelCompactionFactor;
  const gravelTonnes = gravelM3 * P.gravelDensity;
  const gravelCost   = gravelTonnes * P.gravelPerTonne;

  // Rebar: 18" OC both directions over footprint
  const spacingFt   = P.rebarSpacingIn/12;
  const depthFt     = N*(U/12);
  const rbarRunFt   = (Math.ceil(W/spacingFt)+1)*depthFt + (Math.ceil(depthFt/spacingFt)+1)*W;
  const rebarSticks = Math.ceil((rbarRunFt/P.rebarStickFt)*(1+P.rebarWaste));
  const rebarCost   = rebarSticks * P.rebarStickCost;

  // 2×6 lumber forms:
  // Risers: N boards × Width each
  // Sides: 2 sides × N steps × run depth each
  // Base/back board: 1 × Width
  const riserLinFt   = N * W;
  const sideLinFt    = 2 * N * (U/12);
  const baseLinFt    = W;
  const totalLinFt   = riserLinFt + sideLinFt + baseLinFt;
  const lumberBoards = Math.ceil((totalLinFt/P.formBoardFt)*(1+P.formWaste));
  const lumberCost   = lumberBoards * P.formBoard2x6Cost;

  // Total rise height (useful for display)
  const totalRiseIn = N * R;

  return {
    N, riseIn:R, runIn:U, widthFt:W, gravelBaseIn:G,
    concFt3, concM3, footprintFt2, totalRiseIn,
    gravelTonnes, gravelCost,
    rebarSticks, rebarCost,
    riserLinFt, sideLinFt, totalLinFt, lumberBoards, lumberCost,
  };
}

// ─── CALCULATION ─────────────────────────────────────────────────────────────
function calc(){
  const L = parseFloat(state.length)||0, W = parseFloat(state.width)||0;
  const isCustom = state.presetIdx === 2;
  const totalIn  = isCustom ? parseFloat(state.customTotal)||0  : DIG_PRESETS[state.presetIdx].totalIn;
  const gravelIn = isCustom ? parseFloat(state.customGravel)||0 : DIG_PRESETS[state.presetIdx].gravelIn;

  // s1 is optional — if no valid dimensions, steps can still generate a quote
  const s1 = calcSlab(L, W, totalIn, gravelIn, state.finish, state.workDays);

  // ── Second slab ──
  let s2 = null;
  if(state.useSecondSlab){
    const isCustom2 = state.presetIdx2 === 2;
    const totalIn2  = isCustom2 ? parseFloat(state.customTotal2)||0  : DIG_PRESETS[state.presetIdx2].totalIn;
    const gravelIn2 = isCustom2 ? parseFloat(state.customGravel2)||0 : DIG_PRESETS[state.presetIdx2].gravelIn;
    const L2 = parseFloat(state.length2)||0, W2 = parseFloat(state.width2)||0;
    s2 = calcSlab(L2, W2, totalIn2, gravelIn2, state.finish2, state.workDays);
  }

  // ── Steps — resolve gravel depth from preset or custom ──
  const STEP_GRAVEL_PRESETS = [4, 6, null];
  const stepsGravelIn = state.stepsGravelPreset === 2
    ? parseFloat(state.stepsCustomGravel)||4
    : STEP_GRAVEL_PRESETS[state.stepsGravelPreset];
  const stps = state.useSteps
    ? calcSteps(state.stepsCount, state.stepsRise, state.stepsRun, state.stepsWidth, stepsGravelIn)
    : null;

  // Need at least one valid element to generate a quote
  if(!s1 && !s2 && !stps) return null;

  // ── Combined totals ──
  const totalConcM3    = (s1?s1.concM3:0)        + (s2?s2.concM3:0)        + (stps?stps.concM3:0);
  const totalGravelT   = (s1?s1.gravelTonnes:0)  + (s2?s2.gravelTonnes:0)  + (stps?stps.gravelTonnes:0);
  const totalSoilYards = (s1?s1.soilYards:0)     + (s2?s2.soilYards:0);
  const totalSoilTons  = (s1?s1.soilTons:0)      + (s2?s2.soilTons:0);
  const totalAreaFt2   = (s1?s1.areaFt2:0)       + (s2?s2.areaFt2:0);

  // ── Concrete cost ──
  const concCost = totalConcM3 * P.concrete[state.mpa];

  // ── Auto truck detection ──
  const trucksNeeded = totalConcM3>0 ? Math.ceil(totalConcM3/P.truckCapacityM3) : 0;
  const deliveryCost = trucksNeeded * P.concreteDelivery;
  const extraTruck   = trucksNeeded > 1;

  // ── Gravel ──
  const gravelCost = totalGravelT * P.gravelPerTonne;

  // ── Rebar (slab only — steps rebar handled separately in stps) ──
  const totalSlabRebarSticks = (s1?s1.rebarSticks:0) + (s2?s2.rebarSticks:0);
  const rebarCost = totalSlabRebarSticks * P.rebarStickCost;

  // ── Forms (slab perimeters only) ──
  const formCost = (s1?s1.formCost:0) + (s2?s2.formCost:0);

  // ── Labour ──
  const labourCost = P.generalLabour * state.workDays;

  // ── Decorative slab 1 ──
  const colorHardenerCost = s1?s1.colorHardenerCost:0;
  const releaseCost       = s1?s1.releaseCost:0;
  const stampRentalCost   = s1?s1.stampRentalCost:0;
  const sealerCost        = s1?s1.sealerCost:0;

  // ── Decorative slab 2 ──
  const s2ColorHardener = s2?s2.colorHardenerCost:0;
  const s2Release       = s2?s2.releaseCost:0;
  const s2StampRental   = s2?s2.stampRentalCost:0;
  const s2Sealer        = s2?s2.sealerCost:0;

  // ── Disposal (slab soil only) ──
  const trailerTrips   = state.useBobcat?Math.ceil((totalSoilTons*2000)/P.trailerCapacityLb):0;
  const trailerDumpFee = state.useBobcat?(totalSoilTons*parseFloat(state.disposalPerTon||0)):0;
  const binsNeeded     = state.useBin?Math.ceil(totalSoilYards/P.binEffectiveYards):0;
  const binCost        = binsNeeded*P.dumpBin;
  const disposalCost   = trailerDumpFee+binCost;

  // ── Equipment ──
  const truckCost     = state.useTruck?P.pickupTruck*state.workDays:0;
  const bobcatCost    = state.useBobcat?P.bobcatTrailer*state.workDays:0;
  const compactorCost = state.useCompactor?P.plateCompactor*state.workDays:0;
  const jackCost      = state.useJack?P.jackhammer*state.workDays:0;

  const totalCosts = concCost+deliveryCost+gravelCost+rebarCost+formCost
    +labourCost+colorHardenerCost+releaseCost+stampRentalCost+sealerCost
    +s2ColorHardener+s2Release+s2StampRental+s2Sealer
    +(stps?stps.gravelCost:0)+(stps?stps.rebarCost:0)+(stps?stps.lumberCost:0)
    +disposalCost+truckCost+bobcatCost+compactorCost+jackCost;
  const yourProfit = totalCosts*P.PROFIT_RATE;
  const quoteTotal = totalCosts+yourProfit;

  return {
    s1, s2, stps,
    totalConcM3, totalGravelT, totalSoilYards, totalSoilTons, totalAreaFt2,
    totalSlabRebarSticks,
    concCost, deliveryCost, trucksNeeded, extraTruck,
    gravelCost, rebarCost, formCost, labourCost,
    colorHardenerCost, releaseCost, stampRentalCost, sealerCost,
    s2ColorHardener, s2Release, s2StampRental, s2Sealer,
    trailerTrips, trailerDumpFee, binsNeeded, binCost, disposalCost,
    truckCost, bobcatCost, compactorCost, jackCost,
    totalCosts, yourProfit, quoteTotal,
    stepsGravelIn,
  };
}

        ${q.s1?`
          <div class="cat-label">SLAB 1 — ${state.length}×${state.width}ft · ${q.s1.concreteIn}″ pour · ${state.finish}</div>
          ${costRow(`Granular A Gravel ($${P.gravelPerTonne}/t)`,q.s1.gravelCost,true,`${q.s1.gravelTonnes.toFixed(1)} t · ${q.s1.gravelIn}″`)}
          ${costRow(`10M FRP Rebar ($${P.rebarStickCost}/stick)`,q.s1.rebarCost,true,`${q.s1.rebarSticks} sticks`)}
          ${costRow(`${q.s1.formBoardLabel} Forms ($${q.s1.formBoardCost.toFixed(2)}/8ft)`,q.s1.formCost,true,`${q.s1.formBoards} boards`)}
          ${q.s1.isStamped?`
            ${costRow(`Colour Hardener (~$${P.colorHardenerPerSqft}/ft²)`,q.colorHardenerCost,true)}
            ${costRow(`Release Agent (~$${P.releaseAgentPerSqft}/ft²)`,q.releaseCost,true)}
            ${costRow(`Stamp Mat Rental ($${P.stampRental}/day)`,q.stampRentalCost,true)}
          `:''}
          ${needsSealer?costRow(q.s1.isStamped?`Acrylic Cure & Seal (~$${P.sealerStamped}/ft²)`:`Wet-Look Sealer (~$${P.sealerExposed}/ft²)`,q.sealerCost,true):''}
        `:''}

        ${q.s2?`
          <div class="cat-label">SLAB 2 — ${state.length2}×${state.width2}ft · ${q.s2.concreteIn}″ pour · ${state.finish2}</div>
          ${costRow(`Granular A Gravel ($${P.gravelPerTonne}/t)`,q.s2.gravelCost,true,`${q.s2.gravelTonnes.toFixed(1)} t · ${q.s2.gravelIn}″`)}
          ${costRow(`10M FRP Rebar ($${P.rebarStickCost}/stick)`,q.s2.rebarCost,true,`${q.s2.rebarSticks} sticks`)}
          ${costRow(`${q.s2.formBoardLabel} Forms ($${q.s2.formBoardCost.toFixed(2)}/8ft)`,q.s2.formCost,true,`${q.s2.formBoards} boards`)}
          ${q.s2.isStamped?`
            ${costRow(`Colour Hardener (~$${P.colorHardenerPerSqft}/ft²)`,q.s2ColorHardener,true)}
            ${costRow(`Release Agent (~$${P.releaseAgentPerSqft}/ft²)`,q.s2Release,true)}
            ${costRow(`Stamp Mat Rental ($${P.stampRental}/day)`,q.s2StampRental,true)}
          `:''}
          ${s2NeedsSealer?costRow(q.s2.isStamped?`Acrylic Cure & Seal (~$${P.sealerStamped}/ft²)`:`Wet-Look Sealer (~$${P.sealerExposed}/ft²)`,q.s2Sealer,true):''}
        `:''}

        ${q.stps?`
          <div class="cat-label">CONCRETE STEPS — ${q.stps.N} steps · ${q.stps.riseIn}″ rise · ${q.stps.runIn}″ run · ${q.stps.widthFt}ft wide</div>
          <div style="font-size:9px;color:#666;padding-left:8px;padding-bottom:4px">
            Concrete: ${q.stps.concM3.toFixed(3)} m³ · Total rise: ${q.stps.totalRiseIn.toFixed(1)}″ · Footprint: ${q.stps.footprintFt2.toFixed(1)} ft²
          </div>
          ${costRow(`Granular A Gravel — ${q.stps.gravelBaseIn}″ base ($${P.gravelPerTonne}/t)`,q.stps.gravelCost,true,`${q.stps.gravelTonnes.toFixed(2)} t`)}
          ${costRow(`10M FRP Rebar ($${P.rebarStickCost}/stick)`,q.stps.rebarCost,true,`${q.stps.rebarSticks} sticks`)}
          ${costRow(`2×6 Lumber Forms ($${P.formBoard2x6Cost}/8ft)`,q.stps.lumberCost,true,`${q.stps.lumberBoards} boards — risers + sides`)}
        `:''}

        <div class="cat-label">LABOUR & EQUIPMENT</div>
        ${costRow(`Helper Labour ($${P.generalLabour}/day)`,q.labourCost,true,`${state.workDays}d — covers all slabs`)}
        ${q.truckCost>0?costRow(`Ford F-250 ($${P.pickupTruck}/day)`,q.truckCost,true):''}
        ${q.bobcatCost>0?costRow(`Dump Trailer + Bobcat ($${P.bobcatTrailer}/day)`,q.bobcatCost,true):''}
        ${q.compactorCost>0?costRow(`Plate Compactor HD ($${P.plateCompactor}/day)`,q.compactorCost,true):''}
        ${q.jackCost>0?costRow(`Jackhammer HD ($${P.jackhammer}/day)`,q.jackCost,true):''}

        <div class="cat-label">DISPOSAL — ${q.totalSoilYards.toFixed(1)} YDS${q.s1&&q.s2?' (BOTH SLABS)':''}</div>
        ${q.totalSoilYards>0?`
          ${state.useBobcat?costRow(`Trailer Dump Fee (${q.totalSoilTons.toFixed(2)} tons × $${parseFloat(state.disposalPerTon||0).toFixed(0)}/ton)`,q.trailerDumpFee,true):''}
          ${state.useBin?costRow(`Dump Bins (${q.binsNeeded} × $${P.dumpBin} · 10 yd max each)`,q.binCost,true):''}
          ${!state.useBobcat&&!state.useBin?costRow('No disposal selected',0,true):''}
        `:costRow('No excavation — steps only',0,true)}

        <div style="height:8px"></div>
        <div class="cost-row bold">
          <span class="cost-label bold">TOTAL COSTS</span>
          <span class="cost-val bold">${fmtCAD(q.totalCosts)}</span>
        </div>

        <div class="profit-row">
          <div>
            <div class="profit-row-label">YOUR PROFIT — 30%</div>
            <div class="profit-row-sub">Take-home on this job</div>
          </div>
          <div class="profit-row-val">${fmtCAD(q.yourProfit)}</div>
        </div>
      </div>

      <!-- GRAND TOTAL -->
      <div class="grand-total">
        <div class="grand-label">QUOTE TO CLIENT — CASH · NO TAX</div>
        <div class="grand-amount">${fmtCAD(q.quoteTotal)}</div>
        <div class="grand-stats">
          ${[['Per ft²',fmtCAD(q.quoteTotal/q.totalAreaFt2)],['Total ft²',`${q.totalAreaFt2.toFixed(0)}`],['Your Costs',fmtCAD(q.totalCosts)],['Your Profit',fmtCAD(q.yourProfit)]].map(([k,v])=>`
            <div>
              <div class="grand-stat-k">${k.toUpperCase()}</div>
              <div class="grand-stat-v${k==='Your Profit'?' highlight':''}">${v}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="disclaimer">
        ⚠️ Forms: 2×4 used for 4″ pour ($6.60/8ft), 2×6 used for 5″+ pour ($5.98/8ft — Home Depot). Dump trailer: 5-ton max. Disposal cost = total soil weight (tons) × your custom $/ton rate. 14-yd bins capped at 10 yds effective fill per bin — $500 per bin. Gravel: ~$42/t Granular A GTA. Concrete: Redimix/Dufferin GTA 2025/26. HD Rentals: compactor ~$95/day, Hilti TE3000 ~$135/day. All prices subject to change.
      </div>
    `}
  </div>
  `;

  // Reattach events after render
  attachEvents();
}

// ─── HTML HELPERS ────────────────────────────────────────────────────────────
function numInput(id,label,val,suffix,help,min,step){
  return `<div class="input-group">
    <div class="input-label-row">
      <div class="input-label">${label}</div>
      ${help?`<div class="input-help">${help}</div>`:''}
    </div>
    <div class="input-wrap">
      <input type="number" id="inp_${id}" value="${val}" min="${min}" step="${step}" inputmode="decimal"/>
      ${suffix?`<span class="input-suffix">${suffix}</span>`:''}
    </div>
  </div>`;
}

function selInput(id,label,val,options,help,specialId){
  return `<div class="input-group">
    <div class="input-label-row">
      <div class="input-label">${label}</div>
      ${help?`<div class="input-help">${help}</div>`:''}
    </div>
    <div class="input-wrap">
      <select id="${specialId||('sel_'+id)}">
        ${options.map(o=>`<option value="${o}"${o===val?' selected':''}>${o}</option>`).join('')}
      </select>
    </div>
  </div>`;
}

function toggle(id,checked,label,sub,specialId){
  return `<div class="toggle-row" onclick="${specialId||('tog_'+id)}()">
    <div class="toggle-track" style="background:${checked?'#f5a623':'#252525'}">
      <div class="toggle-thumb" style="left:${checked?'19px':'3px'}"></div>
    </div>
    <div>
      <div class="toggle-label" style="color:${checked?'#ddd':'#666'}">${label}</div>
      ${sub?`<div class="toggle-sub">${sub}</div>`:''}
    </div>
  </div>`;
}

function costRow(label,val,indent,sub){
  return `<div class="cost-row${indent?' indented':''}">
    <span class="cost-label">${label}${sub?`<span class="cost-sub">${sub}</span>`:''}</span>
    <span class="cost-val">${fmtCAD(val)}</span>
  </div>`;
}

// ─── EVENTS ───────────────────────────────────────────────────────────────────
function attachEvents(){
  // Numeric inputs
  ['length','width','workDays','customTotal','customGravel','disposalPerTon',
   'length2','width2','customTotal2','customGravel2',
   'stepsCount','stepsRise','stepsRun','stepsWidth','stepsCustomGravel'].forEach(id=>{
    const el = document.getElementById('inp_'+id);
    if(el) el.addEventListener('change', e=>setState({[id]:e.target.value}));
  });
  // Selects
  const finishEl = document.getElementById('sel_finish');
  if(finishEl) finishEl.addEventListener('change',e=>setState({finish:e.target.value}));
  const mpaEl = document.getElementById('sel_mpa');
  if(mpaEl) mpaEl.addEventListener('change',e=>setState({mpa:e.target.value}));
  const finish2El = document.getElementById('sel_finish2');
  if(finish2El) finish2El.addEventListener('change',e=>setState({finish2:e.target.value}));
}

// Toggle functions (called via onclick in HTML string)
window.tog_useTruck     = ()=>setState({useTruck:!state.useTruck});
window.tog_useCompactor = ()=>setState({useCompactor:!state.useCompactor});
window.tog_useJack      = ()=>setState({useJack:!state.useJack});
window.tog_useSecondSlab= ()=>setState({useSecondSlab:!state.useSecondSlab});
window.tog_useSteps     = ()=>setState({useSteps:!state.useSteps});
window.bobcat_toggle    = ()=>setState({useBobcat:!state.useBobcat});
window.bin_toggle       = ()=>setState({useBin:!state.useBin});
window.site_change      = ()=>{
  const v = document.getElementById('site_change').value;
  setState({siteType:v, useJack:v.includes('Concrete')});
};

// Initial render
render();

// ─── SERVICE WORKER ──────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE = 'cqp-v1';
    self.addEventListener('install', e=>{
      e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['.','./'])));
      self.skipWaiting();
    });
    self.addEventListener('fetch', e=>{
      e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)).catch(()=>caches.match('.')));
    });
  `;
  const blob = new Blob([swCode],{type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
